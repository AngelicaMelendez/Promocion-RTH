<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RYTH | Nueva contraseña</title>

    <link rel="icon" type="image/x-icon" href="img/star.ico">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        :root {
            --vino: #691b31;
            --vino-claro: #a02142;
            --dorado: #bc955b;
            --beige: #ddc9a3;
            --blanco: #ffffff;
            --texto-muted: #bc955b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #691b31, #7A1E48, #8A1538);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 150%;
            height: 180%;
            background: url("img/logo_vryt.PNG") no-repeat center / contain;
            opacity: 0.08;
            filter: blur(2px);
            pointer-events: none;
            z-index: 0;
        }

        body > * {
            position: relative;
            z-index: 1;
        }

        .card {
            position: relative;
            overflow: hidden;
            background: rgba(160, 33, 66, 0.90);
            padding: 42px 30px 34px;
            border-radius: 28px;
            width: 100%;
            max-width: 385px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(221, 201, 163, 0.15);
            backdrop-filter: blur(12px);
        }

        .top-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 7px;
            overflow: hidden;
            background: transparent;
        }

        .top-line::before {
            content: "";
            position: absolute;
            top: 0;
            width: 45%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                #8A1538,
                #8A1538,
                #7A1E48,
                transparent
            );
            animation: loadingLine 2s linear infinite;
            border-radius: 20px;
        }

        @keyframes loadingLine {
            0% {
                left: -45%;
            }

            100% {
                left: 100%;
            }
        }

        .logo-icon img {
            width: 160px;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 12px;
            object-fit: contain;
        }

        h2 {
            color: var(--beige);
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--texto-muted);
            font-size: 0.95rem;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .input-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--blanco);
            font-size: 0.90rem;
            font-weight: 700;
        }

        .input-group input {
            width: 100%;
            padding: 13px;
            border-radius: 16px;
            border: none;
            background: rgba(255, 255, 255, 0.95);
            font-size: 0.95rem;
            font-family: 'Montserrat', sans-serif;
            transition: 0.3s;
        }

        .input-group input:focus {
            outline: none;
            background: var(--blanco);
            box-shadow: 0 0 15px rgba(221, 201, 163, 0.35);
            transform: scale(1.01);
        }

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            width: 100%;
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--vino);
            font-size: 1rem;
            cursor: pointer;
            padding: 4px;
            transition: 0.2s;
        }

        .toggle-password:hover {
            color: var(--dorado);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(90deg, var(--dorado), var(--beige));
            color: var(--blanco);
            border: none;
            padding: 14px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 4px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            background: linear-gradient(90deg, var(--beige), var(--dorado));
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        #message {
            font-size: 0.85rem;
            margin-top: 16px;
            display: none;
            font-weight: 600;
            line-height: 1.4;
        }

        .success {
            color: #d4edda;
        }

        .error {
            color: #ffb3b3;
        }

        .back-link {
            margin-top: 25px;
            font-size: 0.85rem;
            color: var(--texto-muted);
            text-decoration: none;
            transition: 0.2s;
        }

        .back-link:hover {
            color: var(--beige);
        }

        @media (max-width: 500px) {
            .card {
                width: 92%;
                padding: 35px 22px;
            }

            .logo-icon img {
                width: 140px;
            }

            h2 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="top-line"></div>

        <div class="logo-icon">
            <img src="img/logo_vryt.png" alt="Logo">
        </div>

        <h2>Nueva contraseña</h2>

        <p class="subtitle">
            Ingresa y confirma tu nueva contraseña para acceder al sistema.
        </p>

        <form id="passwordForm">

            <div class="input-group">
                <label>Nueva contraseña</label>

                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required>

                    <button type="button" class="toggle-password" id="togglePassword">
                        <i class="fas fa-eye" id="iconoPassword"></i>
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label>Confirmar contraseña</label>

                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" placeholder="••••••••" required>

                    <button type="button" class="toggle-password" id="toggleConfirmPassword">
                        <i class="fas fa-eye" id="iconoConfirmPassword"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btnActualizar">
                Actualizar contraseña
            </button>

            <div id="message"></div>

        </form>
    </div>

    <a href="login.html" class="back-link">
        ← Volver al inicio de sesión
    </a>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabase = createClient(
            'https://feylqcbnbndaefshhrpv.supabase.co',
            'sb_publishable_RAlV0OCSUQNvEhmZam1cwA_3aViGAzg'
        )

        const form = document.getElementById('passwordForm')
        const message = document.getElementById('message')
        const btnActualizar = document.getElementById('btnActualizar')

        const passwordInput = document.getElementById('password')
        const confirmPasswordInput = document.getElementById('confirmPassword')

        const togglePassword = document.getElementById('togglePassword')
        const toggleConfirmPassword = document.getElementById('toggleConfirmPassword')

        const iconoPassword = document.getElementById('iconoPassword')
        const iconoConfirmPassword = document.getElementById('iconoConfirmPassword')

        function alternarPassword(input, icono) {
            if (input.type === 'password') {
                input.type = 'text'
                icono.classList.remove('fa-eye')
                icono.classList.add('fa-eye-slash')
            } else {
                input.type = 'password'
                icono.classList.remove('fa-eye-slash')
                icono.classList.add('fa-eye')
            }
        }

        togglePassword.addEventListener('click', () => {
            alternarPassword(passwordInput, iconoPassword)
        })

        toggleConfirmPassword.addEventListener('click', () => {
            alternarPassword(confirmPasswordInput, iconoConfirmPassword)
        })

        function mostrarMensaje(texto, tipo) {
            message.style.display = 'block'
            message.textContent = texto
            message.className = tipo
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault()

            message.style.display = 'none'
            message.textContent = ''

            btnActualizar.disabled = true
            btnActualizar.textContent = 'Actualizando...'

            const password = passwordInput.value
            const confirmPassword = confirmPasswordInput.value

            if (password !== confirmPassword) {
                mostrarMensaje('Las contraseñas no coinciden.', 'error')
                btnActualizar.disabled = false
                btnActualizar.textContent = 'Actualizar contraseña'
                return
            }

            if (password.length < 6) {
                mostrarMensaje('La contraseña debe tener al menos 6 caracteres.', 'error')
                btnActualizar.disabled = false
                btnActualizar.textContent = 'Actualizar contraseña'
                return
            }

            const { error } = await supabase.auth.updateUser({
                password: password
            })

            if (error) {
                mostrarMensaje('No se pudo actualizar la contraseña. Abre nuevamente el enlace del correo.', 'error')
                btnActualizar.disabled = false
                btnActualizar.textContent = 'Actualizar contraseña'
                return
            }

            mostrarMensaje('Contraseña actualizada correctamente. Redirigiendo...', 'success')

            setTimeout(() => {
                window.location.href = 'login.html'
            }, 2000)
        })
    </script>

</body>
</html>
