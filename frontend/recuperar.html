<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RYTH | Recuperar contraseña</title>
<link rel="icon" type="image/x-icon" href="img/star.ico">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{--primary-blue:#bc955b;--text-dark:#ddc9a3;--text-muted:#bc955b}
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:'Montserrat',sans-serif;
background:linear-gradient(135deg,#691b31,#7A1E48,#8A1538);
display:flex;flex-direction:column;justify-content:center;align-items:center;
min-height:100vh;position:relative;overflow-x:hidden
}
body::before{
content:"";position:fixed;top:0;left:0;width:150%;height:180%;
background:url("img/logo_vryt.PNG") no-repeat center/contain;
opacity:.08;filter:blur(2px);pointer-events:none;z-index:0
}
body>*{position:relative;z-index:1}
.card{
position:relative;overflow:hidden;background:rgba(160,33,66,.90);
padding:42px 30px 34px;border-radius:28px;width:100%;max-width:385px;
text-align:center;box-shadow:0 15px 40px rgba(0,0,0,.35);
border:1px solid rgba(221,201,163,.15);backdrop-filter:blur(12px)
}
.top-line{position:absolute;top:0;left:0;width:100%;height:7px;overflow:hidden}
.top-line::before{
content:"";position:absolute;top:0;width:45%;height:100%;
background:linear-gradient(90deg,transparent,#8A1538,#8A1538,#7A1E48,transparent);
animation:loadingLine 2s linear infinite;border-radius:20px
}
@keyframes loadingLine{0%{left:-45%}100%{left:100%}}
.logo-icon img{width:160px;display:block;margin:0 auto 12px}
h2{color:var(--text-dark);font-size:2rem;font-weight:800;margin-bottom:8px}
.subtitle{color:var(--text-muted);font-size:.95rem;margin-bottom:28px;line-height:1.5}
.input-group{text-align:left;margin-bottom:18px}
.input-group label{display:block;margin-bottom:8px;color:white;font-size:.90rem;font-weight:700}
.input-group input{
width:100%;padding:13px;border-radius:16px;border:none;background:rgba(255,255,255,.95);
font-size:.95rem;font-family:'Montserrat',sans-serif
}
.input-group input:focus{outline:none;background:white;box-shadow:0 0 15px rgba(221,201,163,.35)}
.btn-submit{
width:100%;background:linear-gradient(90deg,#bc955b,#ddc9a3);color:white;border:none;
padding:14px;border-radius:16px;font-size:1rem;font-weight:700;font-family:'Montserrat',sans-serif;
cursor:pointer;transition:.3s
}
.btn-submit:disabled{opacity:.7;cursor:not-allowed}
#message{font-size:.85rem;margin-top:16px;display:none;font-weight:600;line-height:1.4}
.success{color:#d4edda}.error{color:#ffb3b3}
.footer-link{margin-top:18px;font-size:.9rem;color:var(--text-muted)}
.footer-link a{color:var(--primary-blue);text-decoration:none;font-weight:700}
.back-link{margin-top:25px;font-size:.85rem;color:var(--text-muted);text-decoration:none}
</style>
</head>

<body>
<div class="card">
<div class="top-line"></div>

<div class="logo-icon">
<img src="img/logo_vryt.png" alt="Logo">
</div>

<h2>Recuperar contraseña</h2>

<p class="subtitle">
Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
</p>

<form id="recuperarForm">
<div class="input-group">
<label>Correo electrónico</label>
<input type="email" id="correo" placeholder="tu@email.com" required>
</div>

<button type="submit" class="btn-submit" id="btnRecuperar">
Enviar enlace
</button>

<div id="message"></div>
</form>

<div class="footer-link">
¿Ya tienes cuenta?
<a href="login.html">Inicia sesión</a>
</div>
</div>

<a href="index.html" class="back-link">← Volver al inicio</a>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
  'https://feylqcbnbndaefshhrpv.supabase.co',
  'sb_publishable_RAlV0OCSUQNvEhmZam1cwA_3aViGAzg'
)

const form = document.getElementById('recuperarForm')
const message = document.getElementById('message')
const btnRecuperar = document.getElementById('btnRecuperar')

function mostrarMensaje(texto, tipo) {
  message.style.display = 'block'
  message.textContent = texto
  message.className = tipo
}

form.addEventListener('submit', async (e) => {
  e.preventDefault()

  message.style.display = 'none'
  btnRecuperar.disabled = true
  btnRecuperar.textContent = 'Enviando...'

  const correo = document.getElementById('correo').value.trim()

  const { error } = await supabase.auth.resetPasswordForEmail(correo, {
    redirectTo: 'http://localhost:5173/nueva-password.html'
  })

  if (error) {
    mostrarMensaje('No se pudo enviar el enlace. Intenta más tarde.', 'error')
    btnRecuperar.disabled = false
    btnRecuperar.textContent = 'Enviar enlace'
    return
  }

  mostrarMensaje('Revisa tu correo. Te enviamos un enlace para restablecer tu contraseña.', 'success')
  btnRecuperar.disabled = false
  btnRecuperar.textContent = 'Enviar enlace'
})
</script>
</body>
</html>
