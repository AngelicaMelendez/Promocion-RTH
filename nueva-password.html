<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RYTH | Nueva contraseña</title>
<link rel="icon" type="image/x-icon" href="img/star.ico">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{--primary-blue:#bc955b;--text-dark:#ddc9a3;--text-muted:#bc955b}
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:'Montserrat',sans-serif;
background:linear-gradient(135deg,#691b31,#7A1E48,#8A1538);
display:flex;flex-direction:column;justify-content:center;align-items:center;
min-height:100vh;position:relative;overflow-x:hidden
}
body::before{
content:"";position:fixed;top:0;left:0;width:150%;height:180%;
background:url("img/logo_vryt.PNG") no-repeat center/contain;
opacity:.08;filter:blur(2px);pointer-events:none;z-index:0
}
body>*{position:relative;z-index:1}
.card{
position:relative;overflow:hidden;background:rgba(160,33,66,.90);
padding:42px 30px 34px;border-radius:28px;width:100%;max-width:385px;
text-align:center;box-shadow:0 15px 40px rgba(0,0,0,.35);
border:1px solid rgba(221,201,163,.15);backdrop-filter:blur(12px)
}
.top-line{position:absolute;top:0;left:0;width:100%;height:7px;overflow:hidden}
.top-line::before{
content:"";position:absolute;top:0;width:45%;height:100%;
background:linear-gradient(90deg,transparent,#8A1538,#8A1538,#7A1E48,transparent);
animation:loadingLine 2s linear infinite;border-radius:20px
}
@keyframes loadingLine{0%{left:-45%}100%{left:100%}}
.logo-icon img{width:160px;display:block;margin:0 auto 12px}
h2{color:var(--text-dark);font-size:2rem;font-weight:800;margin-bottom:8px}
.subtitle{color:var(--text-muted);font-size:.95rem;margin-bottom:28px;line-height:1.5}
.input-group{text-align:left;margin-bottom:16px}
.input-group label{display:block;margin-bottom:8px;color:white;font-size:.90rem;font-weight:700}
.input-group input{
width:100%;padding:13px;border-radius:16px;border:none;background:rgba(255,255,255,.95);
font-size:.95rem;font-family:'Montserrat',sans-serif
}
.btn-submit{
width:100%;background:linear-gradient(90deg,#bc955b,#ddc9a3);color:white;border:none;
padding:14px;border-radius:16px;font-size:1rem;font-weight:700;font-family:'Montserrat',sans-serif;
cursor:pointer;transition:.3s;margin-top:4px
}
.btn-submit:disabled{opacity:.7;cursor:not-allowed}
#message{font-size:.85rem;margin-top:16px;display:none;font-weight:600;line-height:1.4}
.success{color:#d4edda}.error{color:#ffb3b3}
.back-link{margin-top:25px;font-size:.85rem;color:var(--text-muted);text-decoration:none}
</style>
</head>

<body>
<div class="card">
<div class="top-line"></div>

<div class="logo-icon">
<img src="img/logo_vryt.png" alt="Logo">
</div>

<h2>Nueva contraseña</h2>

<p class="subtitle">
Ingresa y confirma tu nueva contraseña para acceder al sistema.
</p>

<form id="passwordForm">
<div class="input-group">
<label>Nueva contraseña</label>
<input type="password" id="password" placeholder="••••••••" required>
</div>

<div class="input-group">
<label>Confirmar contraseña</label>
<input type="password" id="confirmPassword" placeholder="••••••••" required>
</div>

<button type="submit" class="btn-submit" id="btnActualizar">
Actualizar contraseña
</button>

<div id="message"></div>
</form>
</div>

<a href="login.html" class="back-link">← Volver al inicio de sesión</a>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
  'https://feylqcbnbndaefshhrpv.supabase.co',
  'sb_publishable_RAlV0OCSUQNvEhmZam1cwA_3aViGAzg'
)

const form = document.getElementById('passwordForm')
const message = document.getElementById('message')
const btnActualizar = document.getElementById('btnActualizar')

function mostrarMensaje(texto, tipo) {
  message.style.display = 'block'
  message.textContent = texto
  message.className = tipo
}

form.addEventListener('submit', async (e) => {
  e.preventDefault()

  message.style.display = 'none'
  btnActualizar.disabled = true
  btnActualizar.textContent = 'Actualizando...'

  const password = document.getElementById('password').value
  const confirmPassword = document.getElementById('confirmPassword').value

  if (password !== confirmPassword) {
    mostrarMensaje('Las contraseñas no coinciden.', 'error')
    btnActualizar.disabled = false
    btnActualizar.textContent = 'Actualizar contraseña'
    return
  }

  if (password.length < 6) {
    mostrarMensaje('La contraseña debe tener al menos 6 caracteres.', 'error')
    btnActualizar.disabled = false
    btnActualizar.textContent = 'Actualizar contraseña'
    return
  }

  const { error } = await supabase.auth.updateUser({
    password: password
  })

  if (error) {
    mostrarMensaje('No se pudo actualizar la contraseña. Abre nuevamente el enlace del correo.', 'error')
    btnActualizar.disabled = false
    btnActualizar.textContent = 'Actualizar contraseña'
    return
  }

  mostrarMensaje('Contraseña actualizada correctamente. Redirigiendo...', 'success')

  setTimeout(() => {
    window.location.href = 'login.html'
  }, 2000)
})
</script>
</body>
</html>
