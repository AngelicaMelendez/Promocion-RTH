<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RYTH | Iniciar Sesión</title>
    
    <link rel="icon" type="image/x-icon" href="img/star.ico">

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>

        :root {

            --primary-blue: #bc955b;
            --primary-hover: #691b31;
            --bg-color: #691b31;
            --text-dark: #ddc9a3;
            --text-muted: #bc955b;
            --border-color: #691b31;

        }

        * {

            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }

        body {

            font-family: 'Montserrat', sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #691b31,
                    #7A1E48,
                    #8A1538
                );

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            min-height: 100vh;

            position: relative;

            overflow-x: hidden;

        }

        body::before {

            content: "";

            position: fixed;

            top: 0;
            left: 0;

            width: 150%;
            height: 180%;

            background:
                url("img/logo_vryt.PNG")
                no-repeat center / contain;

            opacity: 0.08;

            filter: blur(2px);

            pointer-events: none;

            z-index: 0;

        }

        body > * {

            position: relative;

            z-index: 1;

        }

        .card {

            position: relative;

            overflow: hidden;

            background:
                rgba(160, 33, 66, 0.90);

            padding:
                42px 30px 34px;

            border-radius: 28px;

            width: 100%;
            max-width: 385px;

            text-align: center;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.35),
                inset 0 0 0 1px rgba(255,255,255,0.08);

            border:
                1px solid rgba(221,201,163,0.15);

            backdrop-filter: blur(12px);

        }

        .top-line {

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 7px;

            overflow: hidden;

            background: transparent;

        }

        .top-line::before {

            content: "";

            position: absolute;

            top: 0;

            width: 45%;

            height: 100%;

            background: linear-gradient(
                90deg,
                transparent,
                #8A1538,
                #8A1538,
                #7A1E48,
                transparent
            );

            animation:
                loadingLine 2s linear infinite;

            border-radius: 20px;

        }

        @keyframes loadingLine {

            0% {

                left: -45%;

            }

            100% {

                left: 100%;

            }

        }

        .logo-icon img {

            width: 160px;

            max-width: 100%;

            height: auto;

            display: block;

            margin:
                0 auto 12px;

            object-fit: contain;

        }

        h2 {

            margin:
                0 0 5px 0;

            color:
                var(--text-dark);

            font-size: 2rem;

            font-weight: 800;

        }

        .subtitle {

            color:
                var(--text-muted);

            font-size: 0.95rem;

            margin-bottom: 28px;

            line-height: 1.5;

        }

        /* =========================
           INPUTS COMO REGISTRO
        ========================= */

        .input-group {

            margin-bottom: 16px;

            text-align: left;

        }

        .input-group label {

            display: block;

            margin-bottom: 8px;

            color: white;

            font-size: 0.90rem;

            font-weight: 700;

            font-family: 'Montserrat', sans-serif;

        }

        .input-group input {

            width: 100%;

            padding: 13px;

            border-radius: 16px;

            border: none;

            box-sizing: border-box;

            background:
                rgba(255,255,255,0.95);

            font-size: 0.95rem;

            font-family: 'Montserrat', sans-serif;

            transition: .3s;

        }

        .input-group input:focus {

            outline: none;

            background: white;

            box-shadow:
                0 0 15px rgba(221,201,163,0.35);

            transform:
                scale(1.01);

        }

        .options {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 22px;

            font-size: 0.82rem;

        }

        .options label {

            display: flex;

            align-items: center;

            gap: 5px;

            cursor: pointer;

            color:
                var(--text-muted);

        }

        .options a {

            color:
                var(--primary-blue);

            text-decoration: none;

            font-weight: 500;

        }

        .options a:hover {

            text-decoration: underline;

        }

        .btn-submit {

            width: 100%;

            background:
                linear-gradient(
                    90deg,
                    #bc955b,
                    #ddc9a3
                );

            color: white;

            border: none;

            padding: 14px;

            border-radius: 16px;

            font-size: 1rem;

            font-weight: 700;

            font-family: 'Montserrat', sans-serif;

            cursor: pointer;

            transition: .3s;

            margin-top: 4px;

        }

        .btn-submit:hover {

            transform:
                translateY(-2px);

            background:
                linear-gradient(
                    90deg,
                    #ddc9a3,
                    #bc955b
                );

        }

        .footer-link {

            margin-top: 18px;

            font-size: 0.9rem;

            color:
                var(--text-muted);

        }

        .footer-link a {

            color:
                var(--primary-blue);

            text-decoration: none;

            font-weight: 700;

        }

        .footer-link a:hover {

            text-decoration: underline;

        }

        .back-link {

            margin-top: 25px;

            font-size: 0.85rem;

            color:
                var(--text-muted);

            text-decoration: none;

            font-family: 'Montserrat', sans-serif;

        }

        .back-link:hover {

            color:
                var(--text-dark);

        }

        #error-message {

            color: #ffb3b3;

            font-size: 0.85rem;

            margin-top: 15px;

            display: none;

            font-weight: 600;

        }

        @media(max-width: 500px){

            .card {

                width: 92%;
                padding: 35px 22px;

            }

            .logo-icon img {

                width: 140px;

            }

        }

    </style>

</head>

<body>

    <div class="card">

        <div class="top-line"></div>

        <div class="logo-icon">

            <img
                src="img/logo_vryt.png"
                alt="Logo de Radio y Televisión Hidalgo">

        </div>

        <h2>Bienvenido de vuelta</h2>

        <p class="subtitle">
            Inicia sesión en tu cuenta de Radio y Televisión Hidalgo
        </p>

        <form id="loginForm">

            <div class="input-group">

                <label>Correo electrónico</label>

                <input
                    type="email"
                    id="correo"
                    placeholder="tu@email.com"
                    required>

            </div>

            <div class="input-group">

                <label>Contraseña</label>

                <input
                    type="password"
                    id="clave"
                    placeholder="••••••••"
                    required>

            </div>

            <div class="options">

                <label>

                    <input type="checkbox">

                    Recordarme

                </label>

                <a href="recuperar.html">
                    ¿Olvidaste tu contraseña?
                </a>

            </div>

            <button
                type="submit"
                class="btn-submit">

                Iniciar Sesión

            </button>

            <div id="error-message"></div>

        </form>

        <div class="footer-link">

            ¿No tienes cuenta?

            <a href="registro.html">
                Regístrate aquí
            </a>

        </div>

    </div>

    <a href="index.html" class="back-link">

        ← Volver al inicio

    </a>

    <script type="module" src="app.js"></script>

</body>
</html>
